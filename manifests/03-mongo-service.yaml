# =============================================================================
# manifests/03-mongo-service.yaml
# Headless Service para resolución DNS determinista de Pods (CoreDNS)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: default
  labels:
    app: mongodb
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app: mongodb
