# =============================================================================
# manifests/04-mongo-statefulset.yaml
# StatefulSet de MongoDB 7.0 (3 Réplicas, initContainer de keyfile y PVCs)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: default
  labels:
    app: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Contenedor de inicialización para preparar el archivo keyFile con permisos estrictos (0400)
        - name: init-keyfile
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> [INIT] Copiando keyfile desde Secret al volumen compartido..."
              cp /tmp/raw-keyfile/keyfile /etc/mongo-keyfile/keyfile
              echo "==> [INIT] Ajustando propietario a mongodb (999:999) y permisos a 0400..."
              chown 999:999 /etc/mongo-keyfile/keyfile
              chmod 400 /etc/mongo-keyfile/keyfile
              ls -la /etc/mongo-keyfile/keyfile
              echo "==> [INIT] Keyfile preparado exitosamente."
          volumeMounts:
            - name: raw-keyfile
              mountPath: /tmp/raw-keyfile
              readOnly: true
            - name: mongo-keyfile
              mountPath: /etc/mongo-keyfile
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          command:
            - mongod
            - --config=/etc/mongod.conf
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-config
              mountPath: /etc/mongod.conf
              subPath: mongod.conf
            - name: mongo-keyfile
              mountPath: /etc/mongo-keyfile
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --port=27017
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mongosh
                - --port=27017
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mongo-config
          configMap:
            name: mongo-config
        - name: raw-keyfile
          secret:
            secretName: mongo-secret
            defaultMode: 0400
        - name: mongo-keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
